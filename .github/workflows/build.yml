name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-audio-tiles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-audio-tiles
          path: tv-audio-tiles.apk

      # Publishes the APK under a fixed "latest" release so it has a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest/tv-audio-tiles.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-audio-tiles.apk --title "Latest build" --notes "Built from ${{ github.sha }}"
